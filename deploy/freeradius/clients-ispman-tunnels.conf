#  ISPMan router tunnels. Appended to /etc/freeradius/3.0/clients.conf.
#  docs/wireguard-tunnels.md, section 4.
#
#  Every address in 10.250.0.0/16 is looked up in the nas table by the
#  ispman_tunnel_clients server on its first request, instead of only when the
#  RADIUS server starts. The longest match wins, so a tunnel address never falls
#  through to the 0.0.0.0/0 catch-all, and one with no nas row gets no answer.

client ispman-tunnels {
	ipaddr = 10.250.0.0/16
	dynamic_clients = ispman_tunnel_clients

	#  Each router's client is looked up again after 10 minutes, so a revoked
	#  router's entry is gone within 10 minutes even without a restart. (Its
	#  WireGuard peer goes within a minute, which already cuts it off.)
	lifetime = 600

	#  Required by the config parser on a client block, and never used: each
	#  router's own secret comes from its nas row.
	secret = never-used-each-router-has-its-own
}
